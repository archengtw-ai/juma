<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>誰是音感王 - 鼓聲捕捉挑戰</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: "Microsoft JhengHei", sans-serif; }
        .hero-img { width: 100%; max-width: 300px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 20px; }
        #video-container { display: none; } /* 完全隱藏影片畫面 */
        .game-card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-hit { width: 200px; height: 200px; border-radius: 50%; font-size: 24px; font-weight: bold; transition: transform 0.1s; }
        .btn-hit:active { transform: scale(0.95); }
        .timer-display { font-size: 1.2rem; color: #666; visibility: hidden; }
        .leaderboard { margin-top: 40px; }
        .player-result { font-size: 1.2rem; margin: 10px 0; padding: 10px; border-left: 5px solid #007bff; background: #e9ecef; }
    </style>
</head>
<body>

<div class="container py-5 text-center">
    <img src="https://m.media-amazon.com/images/I/51N9N0x0iqL._SY300_SX300_QL70_FMwebp_.jpg" alt="Whitney Houston" class="hero-img">
    
    <div class="game-card mx-auto" style="max-width: 800px;">
        <h1 class="mb-4">誰是音感王 🏆</h1>

        <!-- 設定模式 -->
        <div id="setup-section" class="row g-3 justify-content-center mb-4">
            <div class="col-md-4">
                <label class="form-label">目標鼓聲秒數</label>
                <input type="number" id="target-time" class="form-control" value="12" step="0.1">
            </div>
            <div class="col-md-4">
                <label class="form-label">玩家人數</label>
                <input type="number" id="player-count" class="form-control" value="3" min="1">
            </div>
            <div class="col-12 mt-3">
                <button class="btn btn-outline-secondary" onclick="previewMusic()">🔊 試聽音軌</button>
                <button class="btn btn-primary" onclick="startGame()">開始比賽</button>
            </div>
        </div>

        <!-- 隱藏的影片播放器 -->
        <div id="video-container">
            <video id="game-audio" src="gamemusic.mp4"></video>
        </div>

        <!-- 比賽模式 -->
        <div id="battle-section" style="display:none;">
            <h3 id="current-player-label" class="mb-4 text-primary">準備好了嗎？</h3>
            <div class="timer-display mb-3">進度已隱藏...</div>
            <button id="hit-btn" class="btn btn-danger btn-hit shadow">按下捕捉鼓聲！<br>(或空白鍵)</button>
            <div id="player-status" class="mt-4"></div>
        </div>

        <!-- 結果顯示 -->
        <div id="result-section" style="display:none;" class="mt-4">
            <h3>結算結果</h3>
            <div id="final-results-list"></div>
            <button class="btn btn-success mt-3" onclick="location.reload()">再玩一次</button>
        </div>

        <hr>

        <!-- 排行榜 -->
        <div class="leaderboard">
            <h4>🏆 歷史前 100 名紀錄</h4>
            <div class="table-responsive">
                <table class="table table-hover mt-3">
                    <thead class="table-dark">
                        <tr>
                            <th>排名</th>
                            <th>玩家</th>
                            <th>誤差秒數</th>
                            <th>時間</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr><td colspan="4">載入紀錄中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx6d-DdauBxPZMoQGv0FFp2wFCbtsFTTvPdpjObO2MuU-8ze9u2Gk3IrN-dE7ubnqc/exec";
    const video = document.getElementById('game-audio');
    let players = [];
    let currentPlayerIndex = 0;
    let targetTime = 12;
    let results = [];

    // 初始化：載入排行榜
    window.onload = fetchLeaderboard;

    function fetchLeaderboard() {
        fetch(GAS_URL)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = data.slice(0, 100).map((row, index) => `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${row.name}</td>
                        <td>${parseFloat(row.diff).toFixed(3)}s</td>
                        <td>${row.date || '-'}</td>
                    </tr>
                `).join('');
            })
            .catch(err => console.error("無法取得紀錄", err));
    }

    function previewMusic() {
        video.currentTime = 0;
        video.play();
        setTimeout(() => video.pause(), 5000); // 試聽 5 秒
        alert("試聽開始（5秒自動停止）");
    }

    function startGame() {
        targetTime = parseFloat(document.getElementById('target-time').value);
        const count = parseInt(document.getElementById('player-count').value);
        players = Array.from({length: count}, (_, i) => `玩家 ${i + 1}`);
        
        document.getElementById('setup-section').style.display = 'none';
        document.getElementById('battle-section').style.display = 'block';
        
        nextTurn();
    }

    function nextTurn() {
        if (currentPlayerIndex < players.length) {
            document.getElementById('current-player-label').innerText = `輪到：${players[currentPlayerIndex]}`;
            video.currentTime = 0;
            video.play();
            
            // 監聽鍵盤空白鍵
            const keyHandler = (e) => {
                if (e.code === 'Space') {
                    captureTime();
                    window.removeEventListener('keydown', keyHandler);
                }
            };
            window.addEventListener('keydown', keyHandler);
            
            // 監聽按鈕點擊
            document.getElementById('hit-btn').onclick = () => {
                captureTime();
                window.removeEventListener('keydown', keyHandler);
            };
        } else {
            showFinalResults();
        }
    }

    function captureTime() {
        const hitTime = video.currentTime;
        const diff = Math.abs(hitTime - targetTime).toFixed(3);
        results.push({ name: players[currentPlayerIndex], hitTime, diff });

        document.getElementById('hit-btn').disabled = true;
        document.getElementById('player-status').innerText = "已捕捉！請聽完經典唱腔...";

        // 強制播放到 15 秒
        const checkTime = setInterval(() => {
            if (video.currentTime >= 15) {
                video.pause();
                clearInterval(checkTime);
                document.getElementById('hit-btn').disabled = false;
                document.getElementById('player-status').innerText = "";
                currentPlayerIndex++;
                nextTurn();
            }
        }, 100);
    }

    function showFinalResults() {
        document.getElementById('battle-section').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';
        
        const list = document.getElementById('final-results-list');
        list.innerHTML = results.map(r => `
            <div class="player-result">
                <strong>${r.name}</strong>: 按下時間 ${r.hitTime.toFixed(3)}s (誤差: ${r.diff}s)
            </div>
        `).join('');

        // 僅將第一名（最準確者）上傳至 GAS
        const winner = results.reduce((prev, curr) => (prev.diff < curr.diff) ? prev : curr);
        uploadResult(winner);
    }

    function uploadResult(data) {
        fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors', // 配合 GAS 常見跨域設定
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(() => {
            console.log("上傳成功");
            fetchLeaderboard(); // 重新載入
        });
    }
</script>

</body>
</html>
