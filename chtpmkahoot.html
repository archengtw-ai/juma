<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHT 專標案辦法測試</title>
    <style>
        :root {
            --primary: #46178f;
            --secondary: #eb144c;
            --accent: #26890c;
            --bg: #f2f2f2;
            --white: #ffffff;
            --progress-bg: #2d9cdb;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
        }
        .container { 
            background: var(--white); 
            width: 100%; 
            max-width: 600px; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; 
            box-sizing: border-box;
        }
        .hidden { display: none; }
        h1 { color: var(--primary); margin-bottom: 10px; }
        input[type="text"] { width: 80%; padding: 12px; margin: 20px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { background: var(--primary); color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        
        .quiz-progress-container { width: 100%; height: 10px; background-color: #e0e0e0; border-radius: 10px; margin-bottom: 8px; overflow: hidden; display: flex; }
        .quiz-progress-fill { height: 100%; background-color: var(--progress-bg); width: 0%; transition: width 0.4s ease-in-out; }
        .quiz-progress-text { font-size: 0.8rem; color: #666; margin-bottom: 15px; text-align: right; }

        .timer-bar { width: 100%; height: 8px; background: #eee; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .timer-progress { height: 100%; background: var(--secondary); width: 100%; transition: width 0.1s linear; }

        .option-btn { display: block; width: 100%; margin: 10px 0; padding: 15px; border: 2px solid var(--primary); background: white; color: var(--primary); font-weight: bold; border-radius: 10px; cursor: pointer; box-sizing: border-box; font-size: 1.1rem; }
        .option-btn:disabled { opacity: 0.8; cursor: not-allowed; }
        
        .option-btn.correct-choice { background-color: var(--accent) !important; color: white !important; border-color: var(--accent) !important; }
        .option-btn.wrong-choice { background-color: var(--secondary) !important; color: white !important; border-color: var(--secondary) !important; }

        .leaderboard-section { margin-top: 20px; border-top: 2px dashed #ddd; padding-top: 15px; max-height: 400px; overflow-y: auto; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 6px 12px; background: #f9f9f9; margin-bottom: 4px; border-radius: 5px; font-size: 0.9rem; }
        .leaderboard-item.top1 { background: #fff3cd; border: 1px solid #ffeeba; font-weight: bold; }
        
        img.quiz-img { max-width: 100%; max-height: 250px; height: auto; width: auto; border-radius: 8px; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto; }
        .feedback { font-weight: bold; margin: 10px 0; font-size: 1.2rem; min-height: 1.5em; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 登入畫面 -->
        <div id="login-screen">
            <h1>專標案辦法測試</h1>
            <p>請輸入名字開始即時競技</p>
            <input type="text" id="username" placeholder="輸入大名...">
            <br>
            <button onclick="startGame()">進入遊戲</button>
        </div>

        <!-- 2. 遊戲畫面 -->
        <div id="game-screen" class="hidden">
            <div class="quiz-progress-container">
                <div id="quiz-progress-fill" class="quiz-progress-fill"></div>
            </div>
            <div id="quiz-progress-text" class="quiz-progress-text">第 0 / 0 題</div>

            <div id="quiz-area">
                <div class="timer-bar"><div id="timer-progress" class="timer-progress"></div></div>
                <h2 id="question-text">載入題目中...</h2>
                <div id="image-container"></div>
                <div id="options-container"></div>
                <div id="feedback-msg" class="feedback"></div>
            </div>
        </div>

        <!-- 3. 公用排行榜區域 -->
        <div id="common-leaderboard" class="leaderboard-section">
            <div class="leaderboard-title" style="font-weight: bold; color: var(--primary); margin-bottom: 10px;">🏆 即時戰報 (Top 10)</div>
            <ul id="leaderboard-list" class="leaderboard-list">
                <p style="color: #999;">正在連線戰報...</p>
            </ul>
        </div>
    </div>

    <script>
        // 請務必替換為新試算表部署的 GAS URL
        const API_URL = "https://script.google.com/macros/s/AKfycbxYao_VUmm382qZPB1fw360FtGlFqI6K-hUcT6dwC7Cf_96I5PV1sqx7w1YIXLQNRgBsw/exec"; 
        
        let currentUser = "";
        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let timer;
        let timeLeft = 20; // 已根據你的需求調整為 20 秒[cite: 2]
        let isAnswering = false;

        window.onload = function() {
            updateLeaderboard();
        };

        async function startGame() {
            currentUser = document.getElementById('username').value;
            if (!currentUser) return alert("請輸入名字！");
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            try {
                const response = await fetch(API_URL);
                questions = await response.json();
                questions.sort(() => Math.random() - 0.5); 
                showQuestion();
            } catch (e) {
                alert("抓取題庫失敗，請確認新試算表的 GAS 部署網址是否正確。");
            }
        }

        function showQuestion() {
            if (currentIndex >= questions.length) return finishGame();
            
            isAnswering = false;
            
            const progressPercent = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('quiz-progress-fill').style.width = progressPercent + "%";
            document.getElementById('quiz-progress-text').innerText = `第 ${currentIndex + 1} / ${questions.length} 題`;

            document.getElementById('feedback-msg').innerText = "";
            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = "";

            const q = questions[currentIndex];
            document.getElementById('question-text').innerText = q.question;
            
            const imgContainer = document.getElementById('image-container');
            imgContainer.innerHTML = q.image ? `<img src="${q.image}" class="quiz-img" alt="題目圖片">` : "";

            let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, q.answer);
                optContainer.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            timeLeft = 20; 
            const progress = document.getElementById('timer-progress');
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft -= 0.1;
                // 20 秒計時下，每秒佔 5%[cite: 2]
                progress.style.width = (timeLeft * 5) + "%"; 
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    if (!isAnswering) checkAnswer(null, null, questions[currentIndex].answer);
                }
            }, 100);
        }

        async function checkAnswer(clickedBtn, selected, correct) {
            if (isAnswering) return;
            isAnswering = true;
            clearInterval(timer);

            const feedback = document.getElementById('feedback-msg');
            const optionButtons = document.querySelectorAll('.option-btn');
            
            optionButtons.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === correct) btn.classList.add('correct-choice');
                if (clickedBtn && btn === clickedBtn && selected !== correct) {
                    btn.classList.add('wrong-choice');
                }
            });
            
            if (selected === correct) {
                // 調整為 20 秒下的計分公式，基準分 100 + 剩餘時間獎勵[cite: 2]
                let points = Math.round(100 + (timeLeft * 5));
                score += points;
                feedback.innerText = `✅ 正確！+${points} 分`;
                feedback.style.color = "var(--accent)";
            } else {
                feedback.innerText = selected === null ? `⌛ 時間到！答案是：${correct}` : `❌ 答錯囉！`;
                feedback.style.color = "var(--secondary)";
            }

            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ name: currentUser, score: score })
            });

            setTimeout(() => {
                updateLeaderboard(); 
                currentIndex++;
                showQuestion();
            }, 1200);
        }

        async function updateLeaderboard() {
            try {
                const response = await fetch(`${API_URL}?action=getLeaderboard`);
                const data = await response.json();
                const list = document.getElementById('leaderboard-list');
                
                if (!data || data.length === 0) return;

                list.innerHTML = data.map((u, i) => `
                    <li class="leaderboard-item ${i === 0 ? 'top1' : ''}">
                        <span>${i+1}. ${u.name} ${i === 0 ? '👑' : ''}</span>
                        <span>${u.score} pts</span>
                    </li>
                `).join('');
            } catch (e) {
                console.log("排行榜更新失敗");
            }
        }

        function finishGame() {
            document.getElementById('quiz-progress-fill').style.width = "100%";
            setTimeout(() => {
                alert(`測試結束！您的最終分數是：${score}`);
                location.reload();
            }, 500);
        }
    </script>
</body>
</html>
