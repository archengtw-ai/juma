<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>誰是音感王 - 挑戰 Whitney Houston</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; margin-bottom: 20px; }
        h2 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .hidden { display: none; }
        .input-group { margin: 10px 0; }
        input { width: 60px; padding: 5px; }
        button { padding: 10px 20px; cursor: pointer; border-radius: 5px; border: none; background: #007bff; color: white; font-size: 16px; transition: 0.3s; }
        button:hover { background: #0056b3; }
        #gameArea { text-align: center; }
        .player-btn { background: #28a745; width: 100%; font-size: 24px; padding: 30px; margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #f8f9fa; }
        #videoPlayer { width: 0; height: 0; opacity: 0; } /* 隱藏畫面但保留功能 */
    </style>
</head>
<body>

    <h1>誰是音感王 🏆</h1>

    <!-- 設定頁面 -->
    <div id="setupPage" class="card">
        <h2>設定頁</h2>
        <p>歌曲：惠妮休斯頓 - I will always love you</p>
        <video id="videoPlayer" src="gamemusic.mp4" preload="auto"></video>
        
        <div class="input-group">
            <button onclick="testMusic()">即時試聽 (播放/暫停)</button>
            <span id="currentTimeDisplay">目前：0.00 秒</span>
        </div>
        
        <div class="input-group">
            目標音秒數：<input type="number" id="targetSec" value="12" step="0.1"> 秒
        </div>
        
        <div class="input-group">
            玩家人數：<input type="number" id="playerCount" value="3" min="1"> 人
        </div>
        
        <button onclick="startGame()" style="width:100%; margin-top:10px;">開始比賽</button>
    </div>

    <!-- 比賽頁面 -->
    <div id="gamePage" class="card hidden">
        <h2 id="turnTitle">準備開始</h2>
        <div id="gameArea">
            <p>聽音樂... 到目標點時按下按鈕！</p>
            <button id="hitBtn" class="player-btn" onclick="playerHit()">按下去！</button>
        </div>
        
        <table id="resultTable">
            <thead>
                <tr>
                    <th>玩家</th>
                    <th>秒差 (秒)</th>
                    <th>名次</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
        <button id="resetBtn" class="hidden" onclick="location.reload()" style="margin-top:20px; background:#6c757d;">重新設定</button>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const targetInput = document.getElementById('targetSec');
        const playerInput = document.getElementById('playerCount');
        let results = [];
        let currentPlayer = 1;

        // 試聽與即時秒數紀錄
        function testMusic() {
            if (video.paused) {
                video.play();
                updateTime();
            } else {
                video.pause();
            }
        }

        function updateTime() {
            if (!video.paused) {
                document.getElementById('currentTimeDisplay').innerText = `目前：${video.currentTime.toFixed(2)} 秒`;
                requestAnimationFrame(updateTime);
            }
        }

        // 開始比賽
        function startGame() {
            document.getElementById('setupPage').classList.add('hidden');
            document.getElementById('gamePage').classList.remove('hidden');
            nextTurn();
        }

        function nextTurn() {
            if (currentPlayer <= playerInput.value) {
                document.getElementById('turnTitle').innerText = `輪到玩家 ${currentPlayer}`;
                video.currentTime = 0;
                video.play();
            } else {
                finishGame();
            }
        }

        function playerHit() {
            const hitTime = video.currentTime;
            const target = parseFloat(targetInput.value);
            const diff = Math.abs(hitTime - target).toFixed(3);
            
            results.push({
                name: `玩家 ${currentPlayer}`,
                diff: parseFloat(diff)
            });

            video.pause();
            currentPlayer++;
            
            updateLeaderboard();
            
            if (currentPlayer <= playerInput.value) {
                alert(`玩家 ${currentPlayer-1} 完成！點擊確定進行下一位。`);
                nextTurn();
            } else {
                finishGame();
            }
        }

        function updateLeaderboard() {
            const tbody = document.getElementById('resultBody');
            tbody.innerHTML = '';
            
            // 排序
            const sortedResults = [...results].sort((a, b) => a.diff - b.diff);
            
            results.forEach((res) => {
                const rank = sortedResults.findIndex(s => s.diff === res.diff) + 1;
                const row = `<tr>
                    <td>${res.name}</td>
                    <td>${res.diff}</td>
                    <td>${rank}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function finishGame() {
            document.getElementById('turnTitle').innerText = "比賽結束！";
            document.getElementById('hitBtn').classList.add('hidden');
            document.getElementById('resetBtn').classList.remove('hidden');
            video.pause();
        }
    </script>
</body>
</html>
