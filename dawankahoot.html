<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動遊戲化測驗 - 即時競技版</title>
    <style>
        :root {
            --primary: #46178f;
            --secondary: #eb144c;
            --accent: #26890c;
            --bg: #f2f2f2;
            --white: #ffffff;
            --progress-bg: #2d9cdb; /* 進度條顏色 */
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
        }
        .container { 
            background: var(--white); 
            width: 100%; 
            max-width: 600px; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; 
            box-sizing: border-box;
        }
        .hidden { display: none; }
        h1 { color: var(--primary); margin-bottom: 10px; }
        input[type="text"] { width: 80%; padding: 12px; margin: 20px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { background: var(--primary); color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        
        /* 答題進度條 (新增) */
        .quiz-progress-container {
            width: 100%;
            height: 12px;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
            display: flex;
        }
        .quiz-progress-fill {
            height: 100%;
            background-color: var(--progress-bg);
            width: 0%; /* 初始長度 */
            transition: width 0.5s ease-in-out;
        }
        .quiz-progress-text {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 15px;
            text-align: right;
        }

        /* 倒數計時條 */
        .timer-bar { width: 100%; height: 8px; background: #eee; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .timer-progress { height: 100%; background: var(--secondary); width: 100%; transition: width 0.1s linear; }

        .option-btn { display: block; width: 100%; margin: 10px 0; padding: 15px; border: 2px solid var(--primary); background: white; color: var(--primary); font-weight: bold; border-radius: 10px; cursor: pointer; box-sizing: border-box; }
        .option-btn:hover:not(:disabled) { background: var(--primary); color: white; }
        .option-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* 排行榜與圖片樣式保持不變 */
        .leaderboard-section { margin-top: 20px; border-top: 2px dashed #ddd; padding-top: 15px; max-height: 400px; overflow-y: auto; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 6px 12px; background: #f9f9f9; margin-bottom: 4px; border-radius: 5px; font-size: 0.9rem; }
        .leaderboard-item.top1 { background: #fff3cd; border: 1px solid #ffeeba; font-weight: bold; }
        img.quiz-img { max-width: 100%; max-height: 250px; height: auto; width: auto; border-radius: 8px; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto; }
        .feedback { font-weight: bold; margin: 10px 0; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 登入畫面 -->
        <div id="login-screen">
            <h1>🎮 115年第1次大琬盃段考 🎮<br>(可能也是最後一次)</h1>
            <p>請輸入名字開始即時競技</p>
            <input type="text" id="username" placeholder="輸入考生姓名...">
            <br>
            <button onclick="startGame()">進入考場</button>
        </div>

        <!-- 2. 遊戲畫面 -->
        <div id="game-screen" class="hidden">
            <!-- 新增進度條 -->
            <div class="quiz-progress-container">
                <div id="quiz-progress-fill" class="quiz-progress-fill"></div>
            </div>
            <div id="quiz-progress-text" class="quiz-progress-text">第 0 / 0 題</div>

            <div id="quiz-area">
                <div class="timer-bar"><div id="timer-progress" class="timer-progress"></div></div>
                <h2 id="question-text">載入題目中...</h2>
                <div id="image-container"></div>
                <div id="options-container"></div>
                <div id="feedback-msg" class="feedback"></div>
                <button id="next-btn" class="hidden" onclick="showNext()">下一題 ➔</button>
            </div>
        </div>

        <!-- 3. 排行榜區域 -->
        <div id="common-leaderboard" class="leaderboard-section">
            <div class="leaderboard-title">🏆 即時戰報 (Top 10)</div>
            <ul id="leaderboard-list" class="leaderboard-list">
                <p style="color: #999;">正在連線戰報...</p>
            </ul>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzmj2KJuaXvLo7iWnNbvhLC1jOTRtUNeVZIZj36kTQ2joWMja7bD3pkfn0IqYipusDTGA/exec"; 
        
        let currentUser = "";
        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let timer;
        let timeLeft = 0;

        window.onload = function() {
            updateLeaderboard();
        };

        async function startGame() {
            currentUser = document.getElementById('username').value;
            if (!currentUser) return alert("請輸入名字！");
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            try {
                const response = await fetch(API_URL);
                questions = await response.json();
                questions.sort(() => Math.random() - 0.5); 
                showQuestion();
            } catch (e) {
                alert("抓取題庫失敗，請檢查網址或連線。");
            }
        }

        function showQuestion() {
            if (currentIndex >= questions.length) return finishGame();
            
            // 更新進度條 (新增部分)
            const progressPercent = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('quiz-progress-fill').style.width = progressPercent + "%";
            document.getElementById('quiz-progress-text').innerText = `第 ${currentIndex + 1} / ${questions.length} 題`;

            document.getElementById('feedback-msg').innerText = "";
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('options-container').classList.remove('hidden');

            const q = questions[currentIndex];
            document.getElementById('question-text').innerText = q.question;
            
            const imgContainer = document.getElementById('image-container');
            imgContainer.innerHTML = q.image ? `<img src="${q.image}" class="quiz-img" alt="題目圖片">` : "";

            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = "";
            
            let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q.answer);
                optContainer.appendChild(btn);
            });

            startTimer();
        }

function startTimer() {
    timeLeft = 20; // 修改這裡，從 20 開始倒數
    const progress = document.getElementById('timer-progress');
    clearInterval(timer);
    timer = setInterval(() => {
        timeLeft -= 0.1;
        // 修改百分比計算：(剩餘時間 / 總時間 20) * 100，簡化後為 timeLeft * 5
        progress.style.width = (timeLeft * 5) + "%"; 
        if (timeLeft <= 0) {
            clearInterval(timer);
            if (!isAnswering) checkAnswer(null, null, questions[currentIndex].answer);
        }
    }, 100);
}

        async function checkAnswer(selected, correct) {
            clearInterval(timer);
            const feedback = document.getElementById('feedback-msg');
            const optionButtons = document.querySelectorAll('.option-btn');
            
            optionButtons.forEach(btn => btn.disabled = true);
            
            if (selected === correct) {
                let points = Math.round(100 + (timeLeft * 10));
                score += points;
                feedback.innerText = `✅ 正確！獲得 ${points} 分`;
                feedback.style.color = "var(--accent)";
            } else {
                feedback.innerText = `❌ 錯誤！正確答案：${correct}`;
                feedback.style.color = "var(--secondary)";
            }

            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ name: currentUser, score: score })
            });

            setTimeout(updateLeaderboard, 800); 
            document.getElementById('next-btn').classList.remove('hidden');
        }

        async function updateLeaderboard() {
            try {
                const response = await fetch(`${API_URL}?action=getLeaderboard`);
                const data = await response.json();
                const list = document.getElementById('leaderboard-list');
                
                if (!data || data.length === 0) {
                    list.innerHTML = "<p>尚無挑戰紀錄</p>";
                    return;
                }

                list.innerHTML = data.map((u, i) => `
                    <li class="leaderboard-item ${i === 0 ? 'top1' : ''}">
                        <span>${i+1}. ${u.name} ${i === 0 ? '👑' : ''}</span>
                        <span>${u.score} pts</span>
                    </li>
                `).join('');
            } catch (e) {
                console.log("無法獲取排行榜資料");
            }
        }

        function showNext() {
            currentIndex++;
            showQuestion();
        }

        function finishGame() {
            // 答完最後一題時，讓進度條填滿
            document.getElementById('quiz-progress-fill').style.width = "100%";
            alert(`遊戲結束！${currentUser} 的總分是：${score}`);
            location.reload();
        }
    </script>
</body>
</html>
